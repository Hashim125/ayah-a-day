{% macro arch(cls='brand-mark') %}<svg class="{{ cls }}" viewBox="0 0 20 24" aria-hidden="true" focusable="false"><path d="M0 24V10a10 10 0 0 1 20 0v14h-5V10.5a5 5 0 0 0-10 0V24z"/></svg>{% endmacro %}

{% macro icon(name) %}<svg class="icon icon-{{ name }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == 'star' %}<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>
{%- elif name == 'share' %}<path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 12.5V20h14v-7.5"/>
{%- elif name == 'link' %}<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>
{%- elif name == 'chevron' %}<path d="M6 9.5l6 6 6-6"/>
{%- elif name == 'shuffle' %}<path d="M4 7h3.5c4.5 0 4.5 10 9 10H20M4 17h3.5c1.6 0 2.6-1.3 3.4-3M14.1 10c.8-1.7 1.8-3 3.4-3H20M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5"/>
{%- elif name == 'theme' %}<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>
{%- elif name == 'arrow' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- endif %}</svg>{% endmacro %}
