services:
  - type: web
    name: ayah-a-day
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py simple_app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_TIMEZONE
        value: Europe/London
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
